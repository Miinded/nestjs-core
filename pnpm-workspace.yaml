packages:
  - packages/*

catalog:
  '@changesets/cli': ^2.31.1
  '@commitlint/cli': ^20.5.3
  '@commitlint/config-conventional': ^20.5.3
  '@nestjs/common': ^11.2.7
  '@nestjs/core': ^11.2.7
  '@nestjs/testing': ^11.2.7
  '@nestjs/typeorm': ^11.0.3
  '@swc/core': ^1.16.20
  '@swc/jest': ^0.2.39
  '@types/jest': ^30.0.0
  '@types/node': ^24.19.2
  '@typescript-eslint/eslint-plugin': ^8.72.1
  '@typescript-eslint/parser': ^8.72.1
  eslint: ^9.39.5
  eslint-config-prettier: ^10.1.8
  husky: ^9.1.7
  jest: ^30.5.2
  lint-staged: ^16.4.0
  prettier: ^3.9.10
  rimraf: ^6.1.3
  rxjs: ^7.8.2
  ts-node: ^10.9.2
  turbo: ^2.11.10
  typescript: ^5.9.3

# Security: lift vulnerable transitive deps to patched versions within the same major.
overrides:
  '@nestjs/microservices@11': ^11.2.5
  'multer@2': ^2.3.0
  'path-to-regexp@8': ^8.4.0
  # @nestjs-modules/ioredis pulls @nestjs/terminus as an optional dep; v12 is ESM-only and breaks Jest (CJS).
  '@nestjs/terminus': ^11.1.1

ignoredBuiltDependencies:
  - '@nestjs/core'

onlyBuiltDependencies:
  - '@swc/core'
  - unrs-resolver
